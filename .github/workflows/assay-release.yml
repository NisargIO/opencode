name: Assay OpenCode release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Unpublished version to build and release
        required: true
        default: 1.18.31-assay.2
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'NisargIO/opencode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENCODE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bunx @antfu/ni --frozen-lockfile
      - run: bunx --package @antfu/ni nr build --single --baseline --skip-install
        working-directory: packages/opencode
      - run: bunx --package @antfu/ni nr typecheck
        working-directory: packages/opencode
      - run: bunx --package @antfu/ni nr test test/server/httpapi-session.test.ts test/session/prompt.test.ts
        working-directory: packages/opencode
      - name: Package the pinned sandbox binary
        run: |
          tar -czf opencode-linux-x64.tar.gz -C packages/opencode/dist/opencode-linux-x64/bin opencode
          tar -czf opencode-linux-x64-baseline.tar.gz -C packages/opencode/dist/opencode-linux-x64-baseline/bin opencode
          sha256sum opencode-linux-x64*.tar.gz > SHA256SUMS
      - name: Publish the sandbox dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$OPENCODE_VERSION" opencode-linux-x64.tar.gz opencode-linux-x64-baseline.tar.gz SHA256SUMS --target "$GITHUB_SHA" --title "OpenCode $OPENCODE_VERSION with native session resume" --notes "Pinned Assay build. Adds POST /session/:sessionID/resume_async without rewriting user messages."
